name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Run compat debt gate (baseline-safe)
        run: node ui/scripts/hm-compat-count.js
      - name: Run surface audit gate (baseline-safe)
        run: node ui/scripts/hm-surface-audit.js
      - name: Run path audit gate (baseline-safe)
        run: node ui/scripts/hm-path-audit.js

  gitleaks:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Run gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test:
    name: test (Windows / Electron)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        working-directory: ui
        run: npm ci
      - name: Run tests
        working-directory: ui
        run: node --no-warnings ./node_modules/jest/bin/jest.js --runInBand --no-coverage

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            relay/package-lock.json
      - name: Install dependencies
        working-directory: ui
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Run source lint
        working-directory: ui
        run: npm run lint
      - name: Run documentation lint
        working-directory: ui
        run: npm run lint:docs
      - name: Audit production dependencies
        working-directory: ui
        run: npm audit --audit-level=high
      - name: Install relay dependencies
        working-directory: relay
        run: npm ci
      - name: Audit relay production dependencies
        working-directory: relay
        run: npm audit --omit=dev --audit-level=high
      - name: Verify generated codebase index
        working-directory: ui
        run: npm run codebase:index:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        working-directory: ui
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Run JSDoc typecheck
        working-directory: ui
        run: npm run typecheck
