[extend]
useDefault = true

# These exact values are deliberately fake inputs used to prove redaction and
# routing behavior. Keep the allowlist value-scoped so a real secret in the
# same test files still fails CI.
[allowlist]
description = "Reviewed synthetic test values"
regexes = [
  '''sk-1234567890abcdefghijklmnop''',
  '''ghp_1234567890abcdefghijklmnop''',
  '''sk-testsecret12345678901234567890''',
  '''mira-live-internal-handoff-approval-v0\.test\.js''',
  '''telegram-in-(?:123|900)''',
  '''hm-journal-routed-1''',
]
